name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: SQL CLI integration tests
        run: make test-sql-cli

  nightly-lint:
    name: nightly clippy (lint surface check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy (nightly)
        run: cargo +nightly clippy --workspace --all-targets -- -D warnings

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: security-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
      - name: Release build
        run: cargo build --release --workspace

  web-admin-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin-console/package-lock.json
      - name: Install dependencies
        working-directory: web/admin-console
        run: npm ci
      - name: Test
        working-directory: web/admin-console
        run: npm test
      - name: Build
        working-directory: web/admin-console
        run: npm run build
