name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: SQL CLI integration tests
        run: make test-sql-cli

  nightly-lint:
    name: nightly clippy (lint surface check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy (nightly)
        run: cargo +nightly clippy --workspace --all-targets -- -D warnings

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: security-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
      - name: Release build
        run: cargo build --release --workspace

  s3-parity:
    name: S3 parity (MinIO)
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: miniominio
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: s3-parity-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Create test bucket
        run: |
          curl -sf http://localhost:9000/minio/health/live
          docker run --rm --network host \
            -e MC_HOST_local=http://minio:miniominio@localhost:9000 \
            minio/mc mb local/test-bucket
      - name: Run S3 parity tests
        env:
          ANALYTICSDB_S3_TEST_BUCKET: test-bucket
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: miniominio
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_ALLOW_HTTP: "true"
          AWS_REGION: us-east-1
        run: cargo test -p analyticsdb-cli --test sql_cli cli_s3_storage_root

  jdbc-smoke:
    name: JDBC smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: jdbc-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build AnalyticsDB server
        run: cargo build -p analyticsdb-server
      - name: Download PostgreSQL JDBC driver
        run: |
          curl -L -o postgresql.jar \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar"
      - name: Run JDBC smoke test
        run: |
          # Pick three free ports: postgres wire, flight SQL, and node communication
          CATALOG=$(mktemp -d)/catalog.db
          PG_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('',0)); print(s.getsockname()[1]); s.close()")
          FL_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('',0)); print(s.getsockname()[1]); s.close()")
          ND_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('',0)); print(s.getsockname()[1]); s.close()")

          ./target/debug/analyticsdb-server \
            --catalog-path "$CATALOG" \
            --postgres-addr "127.0.0.1:$PG_PORT" \
            --flight-sql-addr "127.0.0.1:$FL_PORT" \
            --node-addr "127.0.0.1:$ND_PORT" &
          SERVER_PID=$!

          # Wait for the postgres wire port to be ready (up to 15 seconds)
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 "$PG_PORT" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          # Compile and run the JDBC smoke test
          javac -cp postgresql.jar tests/jdbc/JdbcSmokeTest.java -d /tmp/jdbc_out
          java -cp "/tmp/jdbc_out:postgresql.jar" JdbcSmokeTest 127.0.0.1 "$PG_PORT" postgres postgres postgres
          RESULT=$?

          kill "$SERVER_PID" 2>/dev/null || true
          exit $RESULT

  web-admin-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin-console/package-lock.json
      - name: Install dependencies
        working-directory: web/admin-console
        run: npm ci
      - name: Test
        working-directory: web/admin-console
        run: npm test
      - name: Build
        working-directory: web/admin-console
        run: npm run build

  benchmark:
    name: benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: benchmark-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Download baseline
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: target/criterion
        continue-on-error: true
      - name: Run benchmarks
        run: cargo bench --workspace -- --baseline main 2>&1 | tee benchmark_output.txt
      - name: Check for regressions
        run: |
          # Check if any benchmark regressed by more than 10%
          if grep -E "regressed by [0-9]+(\.[0-9]+)?%" benchmark_output.txt; then
            # Extract regression percentage and check if > 10%
            regression=$(grep -oE "regressed by [0-9]+(\.[0-9]+)?%" benchmark_output.txt | grep -oE "[0-9]+(\.[0-9]+)?" | head -1)
            if [ -n "$regression" ] && [ "$(echo "$regression > 10" | bc)" -eq 1 ]; then
              echo "::error::Benchmark regression detected: $regression% (threshold: 10%)"
              exit 1
            fi
          fi
          echo "No significant benchmark regressions detected"
      - name: Upload baseline
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: target/criterion
          retention-days: 90
