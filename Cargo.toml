[workspace]
members = [
    "crates/analyticsdb-cli",
    "crates/analyticsdb-core",
    "crates/analyticsdb-control",
    "crates/analyticsdb-engine",
    "crates/analyticsdb-protocol",
    "crates/analyticsdb-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
assert_cmd = "2.2.1"
base64 = "0.22.1"
chrono = "0.4.38"
bytes = "1.10.1"
clap = { version = "4.6.1", features = ["derive"] }
datafusion = "53.1.0"
datafusion-common = "53.1.0"
datafusion-execution = "53.1.0"
datafusion-functions-aggregate = "53.1.0"
datafusion-physical-expr = "53.1.0"
datafusion-physical-plan = "53.1.0"
futures = "0.3.31"
pgwire = { version = "0.39.0", default-features = false, features = ["server-api-aws-lc-rs"] }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
openraft = "0.9.13"
rustyline = "14.0.0"
sqlparser = "0.61.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.15"
tokio-stream = "0.1.17"
tonic = { version = "0.14.5", features = ["tls-aws-lc", "tls-native-roots", "tls-webpki-roots"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pki-types = "1.0"
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.4"
http = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v7"] }
object_store = { version = "0.13", features = ["fs", "aws", "gcp", "azure", "tls-webpki-roots"] }
arrow-flight = { version = "58.1.0", features = ["flight-sql"] }
num_cpus = "1.16"
dashmap = "6.0"
bincode = "1.3"
async-stream = "0.3.6"
rusqlite = { version = "0.32", features = ["bundled"] }
