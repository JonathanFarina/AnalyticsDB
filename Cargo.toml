[workspace]
members = [
    "crates/analyticsdb-cli",
    "crates/analyticsdb-core",
    "crates/analyticsdb-control",
    "crates/analyticsdb-engine",
    "crates/analyticsdb-protocol",
    "crates/analyticsdb-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
assert_cmd = "2.2.1"
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.6.1", features = ["derive"] }
datafusion = "53.1.0"
datafusion-common = "53.1.0"
datafusion-physical-expr = "53.1.0"
datafusion-physical-plan = "53.1.0"
futures = "0.3.31"
pgwire = { version = "0.39.0", default-features = false, features = ["server-api-aws-lc-rs"] }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.15"
tokio-stream = "0.1.17"
tonic = "0.14.5"
uuid = { version = "1.18.1", features = ["v7"] }
arrow-flight = { version = "58.1.0", features = ["flight-sql"] }
