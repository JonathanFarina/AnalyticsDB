[graph]
targets = []

[advisories]
version = 2
# Deny all advisories that have not been explicitly ignored
ignore = [
    # async-std discontinued (transitive dep, cannot easily remove)
    "RUSTSEC-2025-0052",
    # bincode unmaintained (transitive dep, cannot easily remove)
    "RUSTSEC-2025-0141",
    # paste unmaintained (transitive dep, cannot easily remove)
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# Internal workspace path deps intentionally omit version constraints
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
